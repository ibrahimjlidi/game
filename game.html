<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sawsen: Star Catch</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1d4ed8;
      --gold: #fbbf24;
      --red: #ef4444;
      --sky: #dbeafe;
      --mint: #7dd3fc;
      --ink: #e2e8f0;
      --panel: rgba(15, 23, 42, 0.48);
      --shadow: rgba(15, 23, 42, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--ink);
    }
    body {
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top, 0px) 12px env(safe-area-inset-bottom, 0px);
    }
    #game {
      position: relative;
      width: min(92vw, 420px);
      height: min(82vh, 720px);
      border-radius: 28px;
      border: 4px solid rgba(255,255,255,0.4);
      box-shadow: 0 22px 52px var(--shadow);
      overflow: hidden;
      background: linear-gradient(180deg, rgba(125, 211, 252, 0.9), rgba(219, 234, 254, 0.9));
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      touch-action: none;
    }
    .hud {
      position: absolute;
      inset: 14px 14px auto 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      z-index: 3;
      pointer-events: none;
    }
    .pill {
      background: rgba(15, 23, 42, 0.58);
      color: white;
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      backdrop-filter: blur(4px);
    }
    @media (max-width: 380px) {
      .hud { inset: 12px 10px auto; gap: 4px; }
      .pill { padding: 6px 5px; border-width: 1px; font-size: 10px; letter-spacing: 0; }
      .photo-button { width: 32px; height: 32px; flex-basis: 32px; }
    }
    .photo-button {
      display: grid;
      place-items: center;
      pointer-events: auto;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 2px solid rgba(255,255,255,0.55);
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.7);
      color: white;
      box-shadow: none;
    }
    .photo-button[hidden] { display: none; }
    .photo-button:hover { background: rgba(15, 23, 42, 0.9); }
    .exit-button {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 5;
    }
    .photo-button svg { width: 18px; height: 18px; }
    .photo-button img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    #photoInput { display: none; }
    #overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.42);
      z-index: 4;
      transition: opacity 0.25s ease;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .panel {
      width: min(100%, 300px);
      max-height: 100%;
      overflow-y: auto;
      padding: 24px 18px 20px;
      border-radius: 24px;
      background: rgba(255,255,255,0.14);
      border: 2px solid rgba(255,255,255,0.38);
      text-align: center;
      box-shadow: 0 18px 35px rgba(15, 23, 42, 0.18);
      backdrop-filter: blur(4px);
    }
    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #dbeafe;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1;
      color: #fff;
      text-shadow: 0 4px 12px rgba(15, 23, 42, 0.32);
    }
    p {
      margin: 0 0 18px;
      line-height: 1.5;
      font-size: 16px;
      color: #f8fafc;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 24px;
      font: inherit;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--gold), #f59e0b);
      color: #111827;
      box-shadow: 0 8px 18px rgba(251, 191, 36, 0.35);
    }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    #choices {
      display: grid;
      gap: 9px;
      margin: 16px 0;
    }
    .choice-button {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid rgba(255,255,255,0.55);
      background: rgba(15, 23, 42, 0.55);
      color: white;
      box-shadow: none;
      font-size: 16px;
    }
    .choice-button:hover { background: rgba(15, 23, 42, 0.78); }
    .panel.theme-picker {
      width: min(100%, 344px);
      padding: 18px 14px;
    }
    .panel.theme-picker .eyebrow { margin-bottom: 4px; }
    .panel.theme-picker h1 { margin-bottom: 8px; font-size: 32px; }
    .panel.theme-picker > p:not(.eyebrow) { margin-bottom: 12px; font-size: 14px; }
    #choices.theme-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin: 12px 0 0;
    }
    .theme-option {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 76px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.32);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.55);
      color: #fff;
      text-align: left;
      font-size: 14px;
      line-height: 1.25;
      box-shadow: none;
    }
    .theme-option:hover { background: rgba(15, 23, 42, 0.78); }
    .theme-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      font-size: 18px;
    }
    .theme-copy { display: grid; gap: 4px; min-width: 0; }
    .theme-name { font-size: 14px; font-weight: 700; }
    .theme-description { color: #cbd5e1; font-size: 11px; font-weight: 400; }
    .theme-count { color: #fde68a; font-size: 10px; font-weight: 700; }
    @media (max-width: 380px) {
      .panel.theme-picker { padding: 12px 10px; }
      .panel.theme-picker h1 { font-size: 28px; }
      .panel.theme-picker > p:not(.eyebrow) { margin-bottom: 6px; font-size: 12px; }
      #choices.theme-grid { gap: 7px; margin-top: 8px; }
      .theme-option { min-height: 54px; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; padding: 7px; }
      .theme-icon { width: 26px; height: 26px; font-size: 16px; }
      .theme-description { display: none; }
      .theme-copy { gap: 2px; }
      .theme-name { font-size: 12px; }
      .theme-count { font-size: 9px; }
    }
    #answerInput {
      width: 100%;
      min-height: 94px;
      padding: 12px;
      resize: vertical;
      border: 2px solid rgba(255,255,255,0.65);
      border-radius: 12px;
      font: inherit;
      font-size: 16px;
    }
    #response, #recap {
      color: #fff;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    #recap { text-align: left; font-size: 14px; }
    #recap p { margin: 0 0 10px; font-size: 14px; }
    .reward-photo {
      display: block;
      width: 72px;
      height: 72px;
      margin: 0 auto 12px;
      border: 3px solid rgba(255,255,255,0.8);
      border-radius: 50%;
      object-fit: cover;
    }
    #startBtn[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="pill">Score <span id="score">0</span>/<span id="target">9</span></div>
      <div class="pill">Time <span id="time">40</span></div>
      <div class="pill">Best <span id="best">0</span></div>
      <button class="photo-button" id="photoButton" type="button" aria-label="Upload a circular photo to replace the hearts" title="Upload a circular photo to replace the hearts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4m-4 4 4-4 4 4" />
          <path d="M20 16.5v3H4v-3" />
        </svg>
      </button>
      <input id="photoInput" type="file" accept="image/*" aria-label="Choose a photo">
    </div>
    <button class="photo-button exit-button" id="exitButton" type="button" aria-label="Exit game and return to the gift page" title="Return to the gift page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 17l5-5-5-5" />
        <path d="M15 12H3" />
        <path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7" />
      </svg>
    </button>

    <canvas id="gameCanvas" width="420" height="720"></canvas>

    <div id="overlay">
      <div class="panel">
        <p class="eyebrow">For Sawsen</p>
        <h1 id="title">Star Catch</h1>
        <p id="message">Catch the glowing hearts and gifts, dodge the storm clouds, and reach 9 points to unlock the first question.</p>
        <div id="choices"></div>
        <p id="response" hidden></p>
        <div id="recap"></div>
        <button id="startBtn">Start the mission</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const targetEl = document.getElementById('target');
    const timeEl = document.getElementById('time');
    const bestEl = document.getElementById('best');
    const exitButton = document.getElementById('exitButton');
    const photoButton = document.getElementById('photoButton');
    const photoInput = document.getElementById('photoInput');
    const overlay = document.getElementById('overlay');
    const panelEl = document.querySelector('.panel');
    const titleEl = document.getElementById('title');
    const messageEl = document.getElementById('message');
    const choicesEl = document.getElementById('choices');
    const responseEl = document.getElementById('response');
    const recapEl = document.getElementById('recap');
    const startBtn = document.getElementById('startBtn');

    const POINTS_PER_LEVEL = 9;
    const START_TIME = 40;
    let bestScore = Number(localStorage.getItem('sawsen-star-best') || 0);
    bestEl.textContent = bestScore;

    let gameState = 'ready';
    let score = 0;
    let timeLeft = START_TIME;
    let player;
    let falling = [];
    let particles = [];
    let animationId = null;
    let lastTs = 0;
    let spawnTimer = 0;
    let pointerX = canvas.width / 2;
    let keys = { left: false, right: false };
    let questionIndex = 0;
    let answers = [];
    let heartImage = new Image();
    let uploadedPhotoUrl = null;
    heartImage.onload = () => {
      setPhotoButtonPreview(heartImage);
      draw();
    };
    heartImage.onerror = () => { heartImage = null; };
    heartImage.src = localStorage.getItem('sawsen-heart-photo') || 'sawsen-photo.jpg';

    const themes = [
      {
        id: 'story',
        icon: '♥',
        name: 'Our Story',
        description: 'Paths, keys, and wishes',
        gift: 'A tiny wish from me, saved just for you.',
        punchline: 'Our story is my favorite plot twist.',
        questions: [

          { summary: 'Key', prompt: 'At a great door, you find two keys, one red and one blue. Which key do you choose?', choices: ['The red key', 'The blue key'] },
          { summary: 'Doorway path', prompt: 'The door opens onto two paths: the path of ذكريات (memories) and the path of أمنيات (wishes). Where do you go?', choices: ['The path of memories', 'The path of wishes'] },
          { summary: 'Gift', prompt: 'In the room, there are three gifts. Which one do you choose?', choices: ['The big gift', 'The small gift', { label: 'The medium gift', feedback: 'The medium gift is empty. Inside, you find a special question just for you.' }] },
          { summary: 'Honest conversations', prompt: 'What do you feel when we talk honestly?', answer: true },
          { summary: 'Beach wish', prompt: 'At the beach, you can send your أمنية (wish) to one person. Who would you send it to?', answer: true }
        ]
      },
      {
        id: 'sport',
        icon: '⚽',
        name: 'Sport',
        description: 'Catch Spain players only',
        gift: 'Your very own tiny champion trophy.',
        punchline: 'You scored the best teammate. (It is me.)',
        questions: [
          { summary: 'Game to play', prompt: 'Which sport would you most like us to play together?', choices: ['Football', 'Basketball', 'Tennis'] },
          { summary: 'Team role', prompt: 'What would be your favorite role on our team?', choices: ['Team captain', 'Playmaker', 'Loudest supporter'] },
          { summary: 'Best skill', prompt: 'Which skill would you want to master?', choices: ['Lightning speed', 'Perfect teamwork', 'Unstoppable accuracy'] },
          { summary: 'Friendly challenge', prompt: 'Pick our first friendly challenge.', choices: ['Penalty shootout', 'Free-throw contest', 'Tennis rally'] },
          { summary: 'Victory treat', prompt: 'After a big win, what should we celebrate with?', choices: ['Pizza', 'Ice cream', 'A little victory dance'] },
          { summary: 'Celebration', prompt: 'How should we celebrate the final point?', choices: ['A high five', 'A silly dance', 'A team selfie'] }
        ]
      },
      {
        id: 'travel',
        icon: '✈',
        name: 'Travel',
        description: 'Plan a little getaway',
        gift: 'A pretend ticket for our next little adventure.',
        punchline: 'We might get lost, but at least we will have snacks.',
        questions: [
          { summary: 'Destination', prompt: 'Choose the setting for our dream getaway.', choices: ['A sunny beach', 'A quiet mountain cabin', 'A lively city'] },
          { summary: 'Journey', prompt: 'How should our adventure begin?', choices: ['A road trip', 'A train ride', 'A flight to somewhere new'] },
          { summary: 'First stop', prompt: 'What should we do first after arriving?', choices: ['Explore the streets', 'Find a beautiful view', 'Try the local food'] },
          { summary: 'Travel keepsake', prompt: 'What little souvenir would you bring home?', choices: ['A postcard', 'A tiny handmade gift', 'A favorite photo'] },
          { summary: 'Travel style', prompt: 'Which kind of travel day sounds best?', choices: ['A full plan and a map', 'A spontaneous wander', 'Relax and see where the day goes'] },
          { summary: 'Travel memory', prompt: 'What would make the trip feel unforgettable?', choices: ['A new experience', 'A beautiful sunset', 'Sharing it with someone special'] }
        ]
      },
      {
        id: 'dreams',
        icon: '✦',
        name: 'Dreams',
        description: 'Imagine what comes next',
        gift: 'One little wish, wrapped up and waiting for you.',
        punchline: 'Dream big. I already saved you the best seat.',
        questions: [
          { summary: 'Perfect day', prompt: 'If you had a completely free day, what would you choose?', choices: ['A cozy day at home', 'A day somewhere new', 'A day with favorite people'] },
          { summary: 'Superpower', prompt: 'Which superpower would you pick?', choices: ['Teleport anywhere', 'Speak every language', 'Pause time for a little while'] },
          { summary: 'New skill', prompt: 'What would you love to learn next?', choices: ['Play an instrument', 'Speak a new language', 'Master a sport'] },
          { summary: 'Dream home', prompt: 'What would your dream home feel like?', choices: ['Peaceful and surrounded by nature', 'Bright and close to the sea', 'Warm and full of friends'] },
          { summary: 'Big celebration', prompt: 'When you reach a big dream, how should we celebrate?', choices: ['A special dinner', 'A spontaneous adventure', 'A quiet moment together'] },
          { summary: 'One wish', prompt: 'If one wish could come true this year, which would you choose?', choices: ['More joy every day', 'A dream adventure', 'A wish for someone you love'] }
        ]
      },
      {
        id: 'music',
        icon: '♫',
        name: 'Music',
        description: 'Songs and favorite sounds',
        gift: 'A front-row seat to our next sing-along.',
        punchline: 'No skips when you are picking the playlist.',
        questions: [
          { summary: 'Playlist mood', prompt: 'What should our shared playlist sound like?', choices: ['Happy pop songs', 'Chill and cozy music', 'A little bit of everything'] },
          { summary: 'Live music', prompt: 'Which live music night would you choose?', choices: ['A big concert', 'A tiny acoustic show', 'Music under the stars'] },
          { summary: 'Car song', prompt: 'What happens when your favorite song comes on in the car?', choices: ['Sing every word', 'Turn it up and dance', 'Play it again'] },
          { summary: 'Dance style', prompt: 'Pick our dance-floor style.', choices: ['Learn a real routine', 'Make up silly moves', 'Just sway together'] },
          { summary: 'Soundtrack', prompt: 'Which sound belongs in the soundtrack of a perfect day?', choices: ['Rain on the window', 'Waves at the beach', 'A favorite song together'] },
          { summary: 'Dedication', prompt: 'If you dedicated one song to someone special, what would it say?', choices: ['You make me smile', 'We can go anywhere', 'You are my favorite person'] }
        ]
      },
      {
        id: 'food',
        icon: '🍓',
        name: 'Food',
        description: 'Favorite treats and little dates',
        gift: 'A tiny invitation to our next dessert date.',
        punchline: 'I promise to share the last bite. Probably.',
        questions: [
          { summary: 'Favorite meal', prompt: 'What kind of meal should we go out for?', choices: ['Italian', 'Tunisian', 'Something new'] },
          { summary: 'Dessert', prompt: 'Pick the perfect dessert to share.', choices: ['Chocolate cake', 'Ice cream', 'Fresh pastries'] },
          { summary: 'Cooking together', prompt: 'What should we try making together?', choices: ['Homemade pizza', 'A sweet cake', 'A family recipe'] },
          { summary: 'Picnic', prompt: 'What belongs in our perfect picnic basket?', choices: ['Fruit and lemonade', 'Sandwiches and snacks', 'A little bit of everything'] },
          { summary: 'Morning treat', prompt: 'Choose a cozy breakfast treat.', choices: ['Pancakes', 'Croissants', 'Fruit and yogurt'] },
          { summary: 'Food adventure', prompt: 'Which food adventure would you pick?', choices: ['Visit a new café', 'Try street food', 'Cook a surprise dinner'] }
        ]
      },
      {
        id: 'movies',
        icon: '🎬',
        name: 'Movies',
        description: 'Pick our next movie night',
        gift: 'A golden ticket for one movie night together.',
        punchline: 'You pick the movie; I pick the snacks.',
        questions: [
          { summary: 'Movie mood', prompt: 'What should we watch tonight?', choices: ['A funny comedy', 'A big adventure', 'A sweet romance'] },
          { summary: 'Movie night', prompt: 'Where should we watch it?', choices: ['Cozy at home', 'Big cinema screen', 'Outside under the stars'] },
          { summary: 'Snack pick', prompt: 'Choose the essential movie snack.', choices: ['Popcorn', 'Chocolate', 'A mix of sweet and salty'] },
          { summary: 'Movie role', prompt: 'What is your movie-night superpower?', choices: ['Pick the perfect film', 'Remember every quote', 'Never fall asleep'] },
          { summary: 'Rewatch', prompt: 'What kind of movie deserves a rewatch?', choices: ['A childhood favorite', 'Something that makes us laugh', 'A story with a happy ending'] },
          { summary: 'Credits', prompt: 'What should happen after the movie ends?', choices: ['Talk about our favorite scene', 'Take a silly photo', 'Start planning the next movie night'] }
        ]
      },
      {
        id: 'friends',
        icon: '☀',
        name: 'friends',
        description: 'Little things that make us smile',
        gift: 'A pocket-sized reminder that I am cheering for you.',
        punchline: 'Best-friend points: still undefeated.',
        questions: [
          { summary: 'Good day', prompt: 'What small thing can turn an ordinary day around?', choices: ['A kind message', 'A favorite snack', 'A reason to laugh'] },
          { summary: 'Teamwork', prompt: 'What makes a great team?', choices: ['Listening to each other', 'Making each other laugh', 'Showing up when it matters'] },
          { summary: 'Hangout', prompt: 'Choose our ideal easy-going hangout.', choices: ['A long walk', 'A board game', 'Coffee and conversation'] },
          { summary: 'Funny memory', prompt: 'What is the best kind of memory to make?', choices: ['A spontaneous adventure', 'A silly inside joke', 'A quiet, honest talk'] },
          { summary: 'Encouragement', prompt: 'When you have a tough day, what helps most?', choices: ['Someone who listens', 'A little distraction', 'A reminder that you can do it'] },
          { summary: 'Tradition', prompt: 'What little tradition should we start?', choices: ['A monthly adventure', 'A shared playlist', 'A celebration for small wins'] }
        ]
      }
    ];

    let activeTheme = null;
    let spainPlayerIndex = 0;
    let spainPlayerDeck = [];
    const spainPlayerNames = [
      'Unai Simon', 'David Raya', 'Alex Remiro', 'Dani Carvajal', 'Jesus Navas',
      'Robin Le Normand', 'Nacho Fernandez', 'Aymeric Laporte', 'Dani Vivian',
      'Alejandro Grimaldo', 'Marc Cucurella', 'Rodri', 'Martin Zubimendi',
      'Mikel Merino', 'Fabian Ruiz', 'Pedri', 'Fermin Lopez', 'Alex Baena',
      'Lamine Yamal', 'Nico Williams', 'Alvaro Morata', 'Joselu',
      'Mikel Oyarzabal', 'Ferran Torres', 'Ayoze Perez', 'Dani Olmo'
    ];
    const decoyPlayerNames = [
      'Lionel Messi', 'Kylian Mbappe', 'Cristiano Ronaldo', 'Erling Haaland',
      'Jude Bellingham', 'Mohamed Salah', 'Harry Kane', 'Neymar',
      'Kevin De Bruyne', 'Luka Modric', 'Virgil van Dijk', 'Robert Lewandowski'
    ];

    function shuffleSpainPlayerDeck() {
      spainPlayerDeck = [
        ...spainPlayerNames.map((name) => ({ name, isSpain: true })),
        ...decoyPlayerNames.map((name) => ({ name, isSpain: false }))
      ];
      for (let index = spainPlayerDeck.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [spainPlayerDeck[index], spainPlayerDeck[swapIndex]] = [spainPlayerDeck[swapIndex], spainPlayerDeck[index]];
      }
      spainPlayerIndex = 0;
    }

    function resetPlayer() {
      player = {
        x: canvas.width / 2,
        y: canvas.height - 42,
        w: 76,
        h: 22,
        speed: 420
      };
    }

    function setOverlay(title, message, buttonText) {
      panelEl.classList.remove('theme-picker');
      choicesEl.classList.remove('theme-grid');
      titleEl.textContent = title;
      messageEl.textContent = message;
      startBtn.textContent = buttonText;
      startBtn.hidden = false;
      choicesEl.replaceChildren();
      responseEl.hidden = true;
      responseEl.textContent = '';
      recapEl.replaceChildren();
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function setPhotoButtonPreview(image) {
      const preview = document.createElement('img');
      preview.alt = '';
      preview.src = image.currentSrc || image.src;
      photoButton.replaceChildren(preview);
      photoButton.title = 'Change the collectible photo';
      photoButton.setAttribute('aria-label', 'Change the collectible photo');
    }

    function getTargetScore() {
      return (questionIndex + 1) * POINTS_PER_LEVEL;
    }

    function updateScoreDisplay() {
      scoreEl.textContent = score;
      targetEl.textContent = getTargetScore();
    }

    function resetGame() {
      score = 0;
      updateScoreDisplay();
    }

    function resetRound() {
      timeLeft = START_TIME;
      timeEl.textContent = Math.ceil(timeLeft);
      falling = [];
      particles = [];
      spawnTimer = 0;
      resetPlayer();
      pointerX = canvas.width / 2;
      updateScoreDisplay();
    }

    function startGame(themeId) {
      activeTheme = themes.find((theme) => theme.id === themeId);
      if (!activeTheme) return;
      questionIndex = 0;
      answers = [];
      if (themeId === 'sport') shuffleSpainPlayerDeck();
      resetGame();
      startRound();
    }

    function renderThemePicker() {
      gameState = 'theme-select';
      activeTheme = null;
      setOverlay('Choose a theme', 'Pick an adventure to begin your six levels.', '');
      panelEl.classList.add('theme-picker');
      choicesEl.classList.add('theme-grid');
      startBtn.hidden = true;

      for (const theme of themes) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'theme-option';
        const icon = document.createElement('span');
        icon.className = 'theme-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = theme.icon;
        const copy = document.createElement('span');
        copy.className = 'theme-copy';
        const name = document.createElement('span');
        name.className = 'theme-name';
        name.textContent = theme.name;
        const description = document.createElement('span');
        description.className = 'theme-description';
        description.textContent = theme.description;
        const count = document.createElement('span');
        count.className = 'theme-count';
        count.textContent = '6 levels';
        copy.append(name, description, count);
        button.append(icon, copy);
        button.addEventListener('click', () => startGame(theme.id));
        choicesEl.append(button);
      }
    }

    function exitGame() {
      cancelAnimationFrame(animationId);
      animationId = null;
      window.location.href = 'index.html';
    }

    function startRound() {
      resetRound();
      gameState = 'playing';
      hideOverlay();
      lastTs = 0;
      cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(loop);
    }

    function endGame(result) {
      gameState = 'ended';
      cancelAnimationFrame(animationId);

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('sawsen-star-best', String(bestScore));
        bestEl.textContent = bestScore;
      }

      if (result === 'win') {
        renderQuestion();
      } else {
        setOverlay('Try again!', `The clouds got in the way. Retry level ${questionIndex + 1} and reach ${getTargetScore()} points.`, 'Retry level');
      }
    }

    function renderQuestion() {
      const question = activeTheme.questions[questionIndex];
      gameState = 'question';
      setOverlay(`${activeTheme.name} · Level ${questionIndex + 1} of 6`, question.prompt, question.answer ? 'Save answer' : 'Continue');

      if (question.answer) {
        const input = document.createElement('textarea');
        input.id = 'answerInput';
        input.maxLength = 500;
        input.placeholder = 'Write your answer here...';
        input.setAttribute('aria-label', question.prompt);
        choicesEl.append(input);
        startBtn.hidden = false;
        return;
      }

      startBtn.hidden = true;
      for (const choice of question.choices) {
        const option = typeof choice === 'string' ? { label: choice } : choice;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice-button';
        button.textContent = option.label;
        button.addEventListener('click', () => {
          answers[questionIndex] = option.label;
          responseEl.textContent = option.feedback || `You chose: ${option.label}`;
          responseEl.hidden = false;
          startBtn.hidden = false;
        });
        choicesEl.append(button);
      }
    }

    function advanceQuestion() {
      questionIndex += 1;
      if (questionIndex < activeTheme.questions.length) {
        gameState = 'round-ready';
        updateScoreDisplay();
        setOverlay(`${activeTheme.name} · Level ${questionIndex + 1} ready`, `Your score carries over. Reach ${getTargetScore()} points to unlock the next question.`, `Play level ${questionIndex + 1}`);
        return;
      }

      gameState = 'reward';
      setOverlay(`${activeTheme.name} complete!`, 'You finished all six levels. Here is your little reward.', 'Choose another theme');
      if (heartImage?.complete && heartImage.naturalWidth > 0) {
        const photo = document.createElement('img');
        photo.className = 'reward-photo';
        photo.src = heartImage.currentSrc || heartImage.src;
        photo.alt = 'Your little reward';
        recapEl.append(photo);
      }

      const gift = document.createElement('p');
      gift.textContent = `🎁 Small gift: ${activeTheme.gift}`;
      recapEl.append(gift);

      const songButton = document.createElement('button');
      songButton.type = 'button';
      songButton.className = 'choice-button';
      songButton.textContent = 'Play “Try Again” on YouTube';
      songButton.addEventListener('click', playGiftSong);
      recapEl.append(songButton);

      const punchline = document.createElement('p');
      punchline.textContent = `One last thing: ${activeTheme.punchline}`;
      recapEl.append(punchline);
    }

    function playGiftSong() {
      window.location.assign('https://www.youtube.com/watch?v=9NUaxxhuop4');
    }

    function handleOverlayAction() {
      if (gameState === 'theme-select') return;
      if (gameState === 'reward') {
        renderThemePicker();
        return;
      }

      if (gameState === 'ended' || gameState === 'round-ready') {
        startRound();
        return;
      }

      if (gameState !== 'question') return;
      const question = activeTheme.questions[questionIndex];
      if (question.answer) {
        const input = document.getElementById('answerInput');
        const answer = input.value.trim();
        if (!answer) {
          input.focus();
          return;
        }
        answers[questionIndex] = answer;
      } else if (!answers[questionIndex]) {
        return;
      }
      advanceQuestion();
    }

    function spawnItem() {
      const isSport = activeTheme?.id === 'sport';
      const roll = Math.random();
      let type = isSport ? 'player' : 'heart';
      if (!isSport && roll > 0.72) type = 'gift';
      if (!isSport && roll > 0.9) type = 'cloud';
      const playerEntry = isSport ? spainPlayerDeck[spainPlayerIndex++ % spainPlayerDeck.length] : null;
      const label = playerEntry?.name || '';
      const labelWidth = isSport ? getPlayerLabelWidth(label) : 0;

      falling.push({
        type,
        label,
        isSpain: playerEntry?.isSpain || false,
        labelWidth,
        x: 30 + Math.random() * (canvas.width - 60),
        y: -20,
        size: type === 'cloud' ? 28 : 22,
        speed: type === 'cloud' ? 175 : type === 'player' ? 105 + Math.random() * 25 : 210 + Math.random() * 60,
        drift: (Math.random() - 0.5) * (type === 'player' ? 28 : 60)
      });
    }

    function getPlayerLabelWidth(name) {
      ctx.save();
      ctx.font = 'bold 12px Georgia, "Times New Roman", serif';
      const width = Math.ceil(ctx.measureText(name).width) + 34;
      ctx.restore();
      return Math.min(174, Math.max(100, width));
    }

    function addBurst(x, y, color, amount) {
      for (let i = 0; i < amount; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 180,
          vy: (Math.random() - 0.8) * 180,
          radius: 2 + Math.random() * 4,
          life: 1,
          color
        });
      }
    }

    function update(dt) {
      if (keys.left) player.x -= player.speed * dt;
      if (keys.right) player.x += player.speed * dt;

      const diff = pointerX - player.x;
      player.x += diff * 0.18;
      player.x = Math.max(36, Math.min(canvas.width - 36, player.x));

      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        endGame('lose');
        return;
      }
      timeEl.textContent = Math.ceil(timeLeft);

      spawnTimer += dt;
      const spawnInterval = activeTheme?.id === 'sport' ? 1.2 : 0.9;
      if (spawnTimer > spawnInterval) {
        spawnTimer = 0;
        spawnItem();
      }

      for (let i = falling.length - 1; i >= 0; i--) {
        const item = falling[i];
        item.x += item.drift * dt;
        item.y += item.speed * dt;

        if (item.x < 18 || item.x > canvas.width - 18) {
          item.drift *= -1;
        }

        const itemHalfWidth = item.type === 'player' ? item.labelWidth / 2 : item.size * 0.8;
        const itemHalfHeight = item.type === 'player' ? 15 : item.size;
        const hitX = Math.abs(item.x - player.x) < (player.w / 2 + itemHalfWidth);
        const hitY = item.y + itemHalfHeight > player.y && item.y - itemHalfHeight < player.y + player.h + 18;

        if (hitX && hitY) {
          if (item.type === 'cloud') {
            score = Math.max(0, score - 1);
            addBurst(item.x, item.y, '#ef4444', 14);
            timeLeft = Math.max(0, timeLeft - 2);
          } else if (item.type === 'player' && !item.isSpain) {
            addBurst(item.x, item.y, '#ef4444', 12);
          } else {
            score += item.type === 'gift' ? 2 : 1;
            addBurst(item.x, item.y, item.type === 'gift' ? '#fbbf24' : '#22c55e', 12);
          }

          falling.splice(i, 1);
          updateScoreDisplay();

          if (score >= getTargetScore()) {
            endGame('win');
            return;
          }
          continue;
        }

        if (item.y > canvas.height + 30) {
          falling.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 120 * dt;
        p.life -= dt * 1.4;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawHeart(x, y, size, color) {
      if (heartImage?.complete && heartImage.naturalWidth > 0) {
        const centerY = y + size * 0.35;
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, centerY, size, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(heartImage, x - size, centerY - size, size * 2, size * 2);
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, centerY, size, 0, Math.PI * 2);
        ctx.stroke();
        return;
      }

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y + size * 0.3);
      ctx.bezierCurveTo(x - size, y - size * 0.5, x - size * 1.5, y + size * 0.4, x, y + size * 1.2);
      ctx.bezierCurveTo(x + size * 1.5, y + size * 0.4, x + size, y - size * 0.5, x, y + size * 0.3);
      ctx.fill();
    }

    function drawGift(x, y, size, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x - size * 0.7, y - size * 0.9, size * 1.4, size * 1.8);
      ctx.fillRect(x - size * 0.2, y - size * 1.5, size * 0.4, size * 1.1);
      ctx.beginPath();
      ctx.moveTo(x - size * 0.9, y - size * 0.4);
      ctx.lineTo(x, y - size * 1.2);
      ctx.lineTo(x + size * 0.9, y - size * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(x - size * 0.15, y - size * 0.2, size * 0.3, size * 1.2);
      ctx.fillRect(x - size * 0.75, y - size * 0.15, size * 1.5, size * 0.3);
    }

    function drawCloud(x, y, size, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x - size * 0.5, y, size * 0.35, 0, Math.PI * 2);
      ctx.arc(x, y - size * 0.2, size * 0.42, 0, Math.PI * 2);
      ctx.arc(x + size * 0.5, y, size * 0.35, 0, Math.PI * 2);
      ctx.arc(x, y + size * 0.18, size * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSoccerBall(x, y, size) {
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      for (let index = 0; index < 5; index += 1) {
        const angle = (Math.PI * 2 * index) / 5 - Math.PI / 2;
        const pointX = x + Math.cos(angle) * size * 0.36;
        const pointY = y + Math.sin(angle) * size * 0.36;
        if (index === 0) ctx.moveTo(pointX, pointY);
        else ctx.lineTo(pointX, pointY);
      }
      ctx.closePath();
      ctx.fill();
    }

    function drawTravelCase(x, y, size) {
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(x - size * 0.9, y - size * 0.55, size * 1.8, size * 1.35);
      ctx.strokeStyle = '#78350f';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - size * 0.9, y - size * 0.55, size * 1.8, size * 1.35);
      ctx.strokeRect(x - size * 0.35, y - size * 0.85, size * 0.7, size * 0.3);
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(x - size * 0.12, y - size * 0.5, size * 0.24, size * 1.25);
    }

    function drawStar(x, y, size, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let index = 0; index < 10; index += 1) {
        const radius = index % 2 === 0 ? size : size * 0.45;
        const angle = (Math.PI * index) / 5 - Math.PI / 2;
        const pointX = x + Math.cos(angle) * radius;
        const pointY = y + Math.sin(angle) * radius;
        if (index === 0) ctx.moveTo(pointX, pointY);
        else ctx.lineTo(pointX, pointY);
      }
      ctx.closePath();
      ctx.fill();
    }

    function drawMusicNote(x, y, size) {
      ctx.strokeStyle = '#f0abfc';
      ctx.fillStyle = '#f0abfc';
      ctx.lineWidth = Math.max(3, size * 0.18);
      ctx.beginPath();
      ctx.ellipse(x - size * 0.35, y + size * 0.45, size * 0.32, size * 0.22, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x - size * 0.05, y + size * 0.35);
      ctx.lineTo(x - size * 0.05, y - size * 0.8);
      ctx.lineTo(x + size * 0.7, y - size * 0.62);
      ctx.lineTo(x + size * 0.7, y + size * 0.05);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.42, y + size * 0.1, size * 0.32, size * 0.22, -0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPlayerName(item) {
      const width = item.labelWidth;
      const height = 30;
      const left = item.x - width / 2;
      const top = item.y - height / 2;
      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#aa151b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(left, top, width, height, 9);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#aa151b';
      ctx.fillRect(left + 6, top + 6, 14, 18);
      ctx.fillStyle = '#f1bf00';
      ctx.fillRect(left + 6, top + 11, 14, 8);

      ctx.fillStyle = '#111827';
      ctx.font = 'bold 12px Georgia, "Times New Roman", serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(item.label, left + 25, item.y, width - 30);
      ctx.restore();
    }

    function drawCupcake(x, y, size) {
      ctx.fillStyle = '#f9a8d4';
      ctx.beginPath();
      ctx.moveTo(x - size * 0.65, y - size * 0.05);
      ctx.lineTo(x + size * 0.65, y - size * 0.05);
      ctx.lineTo(x + size * 0.45, y + size * 0.8);
      ctx.lineTo(x - size * 0.45, y + size * 0.8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff1f2';
      ctx.beginPath();
      ctx.arc(x - size * 0.35, y - size * 0.1, size * 0.4, Math.PI, 0);
      ctx.arc(x + size * 0.28, y - size * 0.25, size * 0.42, Math.PI, 0);
      ctx.arc(x, y - size * 0.42, size * 0.38, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(x, y - size * 0.82, size * 0.12, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawMovieTicket(x, y, size) {
      ctx.fillStyle = '#fde68a';
      ctx.fillRect(x - size * 0.9, y - size * 0.55, size * 1.8, size * 1.1);
      ctx.strokeStyle = '#7f1d1d';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - size * 0.9, y - size * 0.55, size * 1.8, size * 1.1);
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(x, y - size * 0.45);
      ctx.lineTo(x, y + size * 0.45);
      ctx.stroke();
      ctx.setLineDash([]);
      drawStar(x - size * 0.42, y, size * 0.24, '#be123c');
    }

    function drawChatBadge(x, y, size) {
      ctx.fillStyle = '#fef3c7';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.82, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f766e';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.67, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      for (let index = -1; index <= 1; index += 1) {
        ctx.beginPath();
        ctx.arc(x + index * size * 0.3, y, size * 0.09, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawBackground() {
      const themeId = activeTheme?.id || 'story';
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      const palettes = {
        story: ['#f9a8d4', '#ffe4e6', '#fef3c7'],
        sport: ['#60a5fa', '#bae6fd', '#16a34a'],
        travel: ['#fb923c', '#fde68a', '#fda4af'],
        dreams: ['#111827', '#312e81', '#581c87'],
        music: ['#18112f', '#581c87', '#be185d'],
        food: ['#fb923c', '#ffedd5', '#84cc16'],
        movies: ['#111827', '#450a0a', '#7f1d1d'],
        friends: ['#7dd3fc', '#e0f2fe', '#fb7185']
      };
      const colors = palettes[themeId] || palettes.story;
      sky.addColorStop(0, colors[0]);
      sky.addColorStop(0.7, colors[1]);
      sky.addColorStop(1, colors[2]);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (themeId === 'sport') {
        ctx.fillStyle = '#334155';
        ctx.fillRect(0, 260, canvas.width, 150);
        for (let row = 0; row < 4; row += 1) {
          for (let column = 0; column < 15; column += 1) {
            ctx.fillStyle = ['#f87171', '#f8fafc', '#fbbf24', '#38bdf8'][(row + column) % 4];
            ctx.fillRect(column * 30 + 4, 275 + row * 30, 18, 12);
          }
        }
        ctx.fillStyle = '#15803d';
        ctx.fillRect(0, 410, canvas.width, canvas.height - 410);
        ctx.strokeStyle = 'rgba(240,253,244,0.55)';
        ctx.lineWidth = 3;
        for (let y = 470; y < canvas.height; y += 90) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(canvas.width / 2, 575, 72, 0, Math.PI * 2);
        ctx.stroke();
        return;
      }

      if (themeId === 'travel') {
        ctx.fillStyle = '#fde68a';
        ctx.beginPath();
        ctx.arc(325, 145, 48, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#64748b';
        ctx.beginPath();
        ctx.moveTo(0, 420);
        ctx.lineTo(105, 245);
        ctx.lineTo(230, 420);
        ctx.lineTo(340, 270);
        ctx.lineTo(420, 410);
        ctx.lineTo(420, 720);
        ctx.lineTo(0, 720);
        ctx.fill();
        ctx.fillStyle = '#0f766e';
        ctx.beginPath();
        ctx.moveTo(0, 485);
        ctx.lineTo(120, 355);
        ctx.lineTo(250, 490);
        ctx.lineTo(360, 375);
        ctx.lineTo(420, 445);
        ctx.lineTo(420, 720);
        ctx.lineTo(0, 720);
        ctx.fill();
        ctx.strokeStyle = '#fef3c7';
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(40, 720);
        ctx.bezierCurveTo(130, 630, 285, 685, 220, 570);
        ctx.bezierCurveTo(175, 495, 260, 470, 365, 450);
        ctx.stroke();
        return;
      }

      if (themeId === 'food') {
        ctx.fillStyle = '#fff7ed';
        ctx.fillRect(0, 310, canvas.width, 210);
        ctx.fillStyle = '#f97316';
        ctx.fillRect(0, 520, canvas.width, 200);
        for (let row = 0; row < 5; row += 1) {
          for (let column = 0; column < 8; column += 1) {
            ctx.fillStyle = (row + column) % 2 === 0 ? '#ffedd5' : '#fb923c';
            ctx.fillRect(column * 54, 555 + row * 34, 54, 34);
          }
        }
        ctx.fillStyle = '#92400e';
        ctx.fillRect(0, 505, canvas.width, 16);
        ctx.fillStyle = '#fed7aa';
        ctx.beginPath();
        ctx.arc(90, 125, 38, 0, Math.PI * 2);
        ctx.arc(330, 180, 26, 0, Math.PI * 2);
        ctx.fill();
        return;
      }

      if (themeId === 'movies') {
        ctx.fillStyle = '#7f1d1d';
        ctx.fillRect(0, 0, 46, canvas.height);
        ctx.fillRect(canvas.width - 46, 0, 46, canvas.height);
        ctx.fillStyle = '#111827';
        ctx.fillRect(54, 110, canvas.width - 108, 300);
        ctx.strokeStyle = '#fde68a';
        ctx.lineWidth = 5;
        ctx.strokeRect(54, 110, canvas.width - 108, 300);
        ctx.fillStyle = 'rgba(251,191,36,0.2)';
        ctx.beginPath();
        ctx.moveTo(210, 410);
        ctx.lineTo(65, 615);
        ctx.lineTo(355, 615);
        ctx.fill();
        ctx.fillStyle = '#991b1b';
        for (let row = 0; row < 2; row += 1) {
          for (let column = 0; column < 5; column += 1) {
            ctx.fillRect(18 + column * 82, 590 + row * 55, 62, 30);
          }
        }
        return;
      }

      if (themeId === 'friends') {
        ctx.fillStyle = '#fde68a';
        ctx.beginPath();
        ctx.arc(320, 135, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4d7c0f';
        ctx.beginPath();
        ctx.moveTo(0, 470);
        ctx.quadraticCurveTo(105, 385, 210, 475);
        ctx.quadraticCurveTo(315, 380, 420, 465);
        ctx.lineTo(420, 720);
        ctx.lineTo(0, 720);
        ctx.fill();
        ctx.fillStyle = '#fda4af';
        ctx.beginPath();
        ctx.moveTo(150, 720);
        ctx.quadraticCurveTo(180, 585, 110, 475);
        ctx.lineTo(290, 475);
        ctx.quadraticCurveTo(235, 600, 300, 720);
        ctx.fill();
        ctx.fillStyle = '#166534';
        ctx.fillRect(45, 340, 18, 140);
        ctx.beginPath();
        ctx.arc(54, 320, 48, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(355, 320, 16, 160);
        ctx.beginPath();
        ctx.arc(363, 300, 42, 0, Math.PI * 2);
        ctx.fill();
        return;
      }

      if (themeId === 'dreams' || themeId === 'music') {
        for (let index = 0; index < 42; index += 1) {
          const x = (index * 97 + 23) % canvas.width;
          const y = (index * 61 + 30) % 430;
          const radius = index % 5 === 0 ? 3 : 1.5;
          ctx.fillStyle = index % 3 === 0 ? '#fde68a' : 'rgba(255,255,255,0.85)';
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
        if (themeId === 'dreams') {
          ctx.fillStyle = '#fef3c7';
          ctx.beginPath();
          ctx.arc(326, 130, 42, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#25215d';
          ctx.beginPath();
          ctx.arc(344, 113, 40, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#312e81';
          ctx.beginPath();
          ctx.ellipse(210, 695, 280, 130, 0, Math.PI, Math.PI * 2);
          ctx.fill();
          return;
        }
        ctx.fillStyle = '#1f1235';
        ctx.fillRect(0, 490, canvas.width, 230);
        for (let index = 0; index < 14; index += 1) {
          const barHeight = 24 + ((index * 31) % 80);
          ctx.fillStyle = ['#f0abfc', '#22d3ee', '#fb7185'][index % 3];
          ctx.globalAlpha = 0.8;
          ctx.fillRect(index * 32, 625 - barHeight, 18, barHeight);
        }
        ctx.globalAlpha = 1;
        return;
      }

      for (let index = 0; index < 16; index += 1) {
        const x = (index * 83 + 19) % canvas.width;
        const y = (index * 47 + 35) % 430;
        drawStar(x, y, index % 4 === 0 ? 6 : 3, 'rgba(255,255,255,0.85)');
      }
      ctx.fillStyle = '#86a052';
      ctx.fillRect(0, 570, canvas.width, 150);
      for (let x = 18; x < canvas.width; x += 42) {
        ctx.fillStyle = '#f472b6';
        ctx.beginPath();
        ctx.arc(x, 590 + (x % 3) * 8, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fef3c7';
        ctx.beginPath();
        ctx.arc(x + 7, 610 + (x % 2) * 5, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPlayer() {
      const x = player.x;
      const y = player.y;
      if (activeTheme?.id === 'sport') {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(x - 38, y - 14, 76, 38);
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(x - 38, y + 8, 76, 16);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(x - 6, y - 14, 12, 20);
        return;
      }
      if (activeTheme?.id === 'travel') {
        ctx.fillStyle = '#92400e';
        ctx.fillRect(x - 34, y - 16, 68, 38);
        ctx.strokeStyle = '#fcd34d';
        ctx.lineWidth = 4;
        ctx.strokeRect(x - 34, y - 16, 68, 38);
        ctx.strokeRect(x - 13, y - 25, 26, 9);
        ctx.fillStyle = '#fcd34d';
        ctx.fillRect(x - 5, y - 14, 10, 34);
        return;
      }
      if (activeTheme?.id === 'dreams') {
        ctx.fillStyle = '#e9d5ff';
        ctx.beginPath();
        ctx.ellipse(x, y + 5, 40, 16, 0, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c4b5fd';
        ctx.fillRect(x - 34, y + 5, 68, 10);
        drawStar(x, y - 15, 12, '#fde68a');
        return;
      }
      if (activeTheme?.id === 'music') {
        ctx.fillStyle = '#312e81';
        ctx.fillRect(x - 38, y - 18, 76, 38);
        ctx.strokeStyle = '#f0abfc';
        ctx.lineWidth = 3;
        ctx.strokeRect(x - 38, y - 18, 76, 38);
        ctx.fillStyle = '#22d3ee';
        ctx.beginPath();
        ctx.arc(x - 19, y, 10, 0, Math.PI * 2);
        ctx.arc(x + 19, y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f0abfc';
        ctx.fillRect(x - 5, y - 14, 10, 6);
        return;
      }
      if (activeTheme?.id === 'food') {
        ctx.fillStyle = '#fef3c7';
        ctx.beginPath();
        ctx.ellipse(x, y + 4, 40, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 4;
        ctx.stroke();
        drawCupcake(x, y - 14, 12);
        return;
      }
      if (activeTheme?.id === 'movies') {
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(x - 32, y - 18, 64, 38);
        ctx.fillStyle = '#fff7ed';
        ctx.beginPath();
        ctx.moveTo(x - 32, y - 18);
        ctx.lineTo(x + 32, y - 18);
        ctx.lineTo(x + 25, y - 30);
        ctx.lineTo(x + 12, y - 18);
        ctx.lineTo(x, y - 30);
        ctx.lineTo(x - 12, y - 18);
        ctx.lineTo(x - 25, y - 30);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(x - 26, y + 15, 52, 6);
        return;
      }
      if (activeTheme?.id === 'friends') {
        ctx.fillStyle = '#854d0e';
        ctx.fillRect(x - 38, y - 4, 76, 18);
        ctx.fillRect(x - 34, y + 12, 7, 14);
        ctx.fillRect(x + 27, y + 12, 7, 14);
        ctx.fillStyle = '#fda4af';
        ctx.fillRect(x - 38, y - 12, 76, 9);
        ctx.fillStyle = '#166534';
        ctx.fillRect(x - 34, y - 25, 7, 15);
        ctx.fillRect(x + 27, y - 25, 7, 15);
        return;
      }
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x - player.w / 2, y, player.w, 8);
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(x - 18, y - 18, 36, 18);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(x - 8, y - 26, 16, 12);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x - player.w / 2 + 10, y + 8, player.w - 20, 7);
    }

    function drawItem(item) {
      const themeId = activeTheme?.id || 'story';
      if (item.type === 'player') {
        drawPlayerName(item);
        return;
      }
      if (item.type === 'heart') {
        if (themeId === 'travel') drawTravelCase(item.x, item.y, item.size);
        else if (themeId === 'dreams') drawStar(item.x, item.y, item.size, '#fde68a');
        else if (themeId === 'music') drawMusicNote(item.x, item.y, item.size);
        else if (themeId === 'food') drawCupcake(item.x, item.y, item.size);
        else if (themeId === 'movies') drawMovieTicket(item.x, item.y, item.size);
        else if (themeId === 'friends') drawChatBadge(item.x, item.y, item.size);
        else drawHeart(item.x, item.y, item.size, '#ef4444');
      }
      if (item.type === 'gift') {
        const giftColors = { story: '#fb7185', sport: '#fbbf24', travel: '#38bdf8', dreams: '#c084fc', music: '#2dd4bf', food: '#f97316', movies: '#fde68a', friends: '#fb7185' };
        drawGift(item.x, item.y, item.size, giftColors[themeId] || '#fbbf24');
      }
      if (item.type === 'cloud') {
        const cloudColors = { story: '#fff1f2', sport: '#cbd5e1', travel: '#e2e8f0', dreams: '#c4b5fd', music: '#f0abfc', food: '#fff7ed', movies: '#fecaca', friends: '#e0f2fe' };
        drawCloud(item.x, item.y, item.size, cloudColors[themeId] || '#dbeafe');
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function draw() {
      drawBackground();

      for (const item of falling) {
        drawItem(item);
      }

      drawParticles();
      drawPlayer();
    }

    function loop(ts) {
      if (gameState !== 'playing') return;

      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.033, (ts - lastTs) / 1000);
      lastTs = ts;

      update(dt);
      draw();
      animationId = requestAnimationFrame(loop);
    }

    function moveByKey(code, active) {
      if (code === 'ArrowLeft' || code === 'KeyA') keys.left = active;
      if (code === 'ArrowRight' || code === 'KeyD') keys.right = active;
    }

    exitButton.addEventListener('click', exitGame);
    photoButton.addEventListener('click', () => photoInput.click());

    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          localStorage.setItem('sawsen-heart-photo', reader.result);
        } catch (error) {
          console.warn('Could not save the photo for future visits.', error);
        }
      };
      reader.readAsDataURL(file);

      const photoUrl = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        if (uploadedPhotoUrl) URL.revokeObjectURL(uploadedPhotoUrl);
        uploadedPhotoUrl = photoUrl;
        heartImage = image;
        setPhotoButtonPreview(image);
        draw();
      };
      image.onerror = () => URL.revokeObjectURL(photoUrl);
      image.src = photoUrl;
    });

    canvas.addEventListener('pointermove', (event) => {
      const rect = canvas.getBoundingClientRect();
      pointerX = ((event.clientX - rect.left) / rect.width) * canvas.width;
    });

    canvas.addEventListener('pointerdown', () => {
      if (gameState !== 'playing') {
        startGame();
      }
    });

    window.addEventListener('keydown', (event) => {
      if (event.code === 'Space' || event.code === 'Enter') {
        if (gameState === 'ended' || gameState === 'round-ready') startRound();
      }
      moveByKey(event.code, true);
    });

    window.addEventListener('keyup', (event) => {
      moveByKey(event.code, false);
    });

    startBtn.addEventListener('click', handleOverlayAction);

    resetRound();
    draw();
    renderThemePicker();
  </script>
</body>
</html>
